name: Release checks

on:
  push:
    branches: [main, windows-version]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-mcp:
    name: Source package and MCP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate files and source-package round trip
        run: python packaging/release_check.py --output dist
      - name: Install the extracted source package
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tomllib
          import zipfile

          archive = next(Path('dist').glob('*-source.zip'))
          destination = Path(os.environ['RUNNER_TEMP']) / 'echopath-release'
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(destination)
          root = next(destination.glob('EchoPath-*')).resolve()
          project = tomllib.loads((root / 'pyproject.toml').read_text())['project']
          extra = 'windows' if sys.platform == 'win32' else 'macos' if sys.platform == 'darwin' else None
          suffix = f'[{extra}]' if extra in project.get('optional-dependencies', {}) else ''
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(root) + suffix], check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write('ECHOPATH_RELEASE_ROOT=' + root.as_posix() + '\n')
          PY
      - name: Verify MCP tools and smoke check without model or desktop actions
        working-directory: ${{ env.ECHOPATH_RELEASE_ROOT }}
        run: python packaging/verify.py --config echopath.config.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-package-${{ matrix.os }}
          path: |
            dist/*-source.zip
            dist/*.sha256
          if-no-files-found: error
